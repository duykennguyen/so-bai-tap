<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="DUY tập Gym: bài tập gym và ngoài trời theo nhóm cơ, mỗi bài có clip minh họa và 3 bước làm theo.">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img,video{max-width:100%}[hidden]{display:none!important}</style>
<title>DUY tập Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: sticky muscle-group rail on top, card grid of exercises below; tap a card for a full "how-to" sheet. Phone-first, used between sets. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15202b; --muted:#5d6b78; --line:#d5dce3;
  --accent:#1f5eff; --accent-ink:#ffffff; --warn:#c2410c; --ok:#15803d;
  --chip:#e3e8ee;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --g-nguc:#e11d48; --g-lung:#7c3aed; --g-vai:#0891b2; --g-tay:#ea580c; --g-bung:#ca8a04;
  --g-chan:#16a34a; --g-cardio:#dc2626; --g-toan-than:#1f5eff; --g-gian-co:#0d9488; --g-co-vai-gay:#9333ea; --g-kegel:#db2777;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 14px rgba(21,32,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf3; --muted:#93a1ae; --line:#2a3642;
  --accent:#6b93ff; --accent-ink:#0b1220; --warn:#fb923c; --ok:#4ade80; --chip:#222d38;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e7edf3; --muted:#93a1ae; --line:#2a3642;
  --accent:#6b93ff; --accent-ink:#0b1220; --warn:#fb923c; --ok:#4ade80; --chip:#222d38;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 64px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,52px);line-height:.95;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}

.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line);margin-top:16px}
.groups{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.groups::-webkit-scrollbar{display:none}
.g{flex:0 0 auto;border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;display:flex;gap:6px;align-items:center}
.g .n{font-family:var(--body);font-size:12px;font-weight:600;opacity:.65;font-variant-numeric:tabular-nums}
.g .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.g[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sub{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px}

.session{margin-top:16px;background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px 16px}
.session h2{font-family:var(--display);text-transform:uppercase;font-size:22px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.session ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.session li{display:flex;gap:10px;align-items:center}
.session li input{width:20px;height:20px;accent-color:var(--accent)}
.session li button{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:600}
.session li.done button{text-decoration:line-through;color:var(--muted)}
.session .dose{margin-left:auto;font-family:var(--display);font-weight:700;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}

.section-h{font-family:var(--display);text-transform:uppercase;font-size:26px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.section-h .bar{width:6px;height:22px;border-radius:3px;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}}
.card{background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--line);text-align:left;padding:0}
.card:hover{border-color:var(--accent)}
.media{aspect-ratio:3/4;background:#05080b;position:relative;display:grid;place-items:center;overflow:hidden;max-width:100%}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ph{font-family:var(--display);font-size:56px;font-weight:800;color:var(--c);opacity:.35;text-transform:uppercase}
.badge{position:absolute;top:8px;left:8px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;letter-spacing:.04em}
.badge.place{left:auto;right:8px}
.cbody{padding:8px 10px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.cname{font-family:var(--display);font-size:18px;font-weight:700;line-height:1.05;text-transform:uppercase;min-width:0}
.cdose{font-family:var(--display);font-size:15px;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cmeta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.cmeta .d{font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.steps{margin:2px 0 0;padding-left:20px;font-size:13.5px;display:grid;gap:2px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted);margin-top:18px}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:22px;text-transform:uppercase;margin-bottom:4px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.sheet{border-radius:18px}}
.sheet .media{aspect-ratio:auto;height:min(62vh,640px)}
.shead{padding:16px 18px 6px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.shead h2{font-family:var(--display);text-transform:uppercase;font-size:32px;line-height:1;margin:0}
.shead .en{font-size:13px;color:var(--muted);margin-top:4px}
.x{border:0;background:var(--chip);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;flex:0 0 auto}
.sbody{padding:4px 18px 20px;display:grid;gap:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{background:var(--chip);border-radius:10px;padding:6px 12px;font-size:13px}
.fact b{font-family:var(--display);font-size:18px;margin-right:4px}
.blk h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.blk ol,.blk ul{margin:0;padding-left:22px;display:grid;gap:4px}
.blk.cues li::marker{color:var(--ok)}
.blk.miss li::marker{color:var(--warn)}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding:8px 18px 0}
.thumbs button{border:2px solid transparent;border-radius:8px;padding:0;width:64px;height:48px;overflow:hidden;cursor:pointer;flex:0 0 auto;background:var(--chip)}
.thumbs button[aria-pressed="true"]{border-color:var(--accent)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:cover}
.srcl{font-size:13px;color:var(--accent);word-break:break-all}
.sfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:0 18px 18px}

/* form */
form.ed{padding:16px 18px 20px;display:grid;gap:12px}
form.ed h2{font-family:var(--display);text-transform:uppercase;font-size:28px;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label input,label select,label textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14.5px;font-weight:400;color:var(--ink);min-width:0}
label textarea{min-height:84px;resize:vertical}
.hint{font-weight:400;font-size:12px}
.mlist{display:flex;gap:6px;flex-wrap:wrap}
.mitem{position:relative;width:72px;height:54px;border-radius:8px;overflow:hidden;background:var(--chip)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover}
.mitem button{position:absolute;top:2px;right:2px;border:0;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--warn)}
.credit{margin-top:32px;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:559px){
  .wrap{padding-inline:10px;padding-block:12px 48px}
  .rail{margin-inline:-10px;padding:8px 10px 8px;margin-top:10px}
  h1{font-size:34px}
  h1 small{font-size:12px;margin-top:4px}
  .btn{padding:7px 12px;min-height:38px;font-size:14px}
  .g{font-size:15px;padding:6px 11px}
  .seg button{padding:5px 9px;font-size:12px}
  .search{padding:6px 10px;font-size:13px}
  .section-h{font-size:21px;margin:16px 0 8px}
  .card{border-radius:10px}
  .cbody{padding:6px 7px 8px;flex-direction:column;align-items:flex-start;gap:2px}
  .cname{font-size:14.5px;line-height:1.1}
  .cdose{font-size:13px}
  .badge{font-size:10px;padding:2px 6px;top:5px;left:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>DUY tập Gym<small>Mở nhóm cơ, nhìn hình, làm theo 3 bước.</small></h1>
    <div class="actions">
      <button class="btn primary" id="pickBtn" type="button">Bốc buổi tập</button>
          </div>
  </header>

  <div class="rail">
    <div class="groups" id="groups" role="toolbar" aria-label="Nhóm cơ"></div>
    <div class="sub">
      <div class="seg" id="place" role="group" aria-label="Nơi tập">
        <button type="button" data-v="all" aria-pressed="true">Tất cả</button>
        <button type="button" data-v="gym" aria-pressed="false">Phòng gym</button>
        <button type="button" data-v="ngoai-troi" aria-pressed="false">Ngoài trời</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Tìm bài: squat, hít đất…" aria-label="Tìm bài tập">
    </div>
  </div>

  <section class="session" id="session" hidden></section>
  <div id="list"></div>
  <p class="credit">Clip minh họa trích từ video gốc của các tác giả trên Facebook. Bấm vào từng bài để xem link nguồn.</p>
</div>

<div class="overlay" id="overlay" hidden></div>

<script>
const GROUPS=[
  {k:"nguc",n:"Ngực"},{k:"lung",n:"Lưng"},{k:"vai",n:"Vai"},{k:"tay",n:"Tay"},
  {k:"bung",n:"Bụng"},{k:"chan",n:"Chân & mông"},{k:"cardio",n:"Cardio"},
  {k:"toan-than",n:"Toàn thân"},{k:"gian-co",n:"Giãn cơ"},{k:"co-vai-gay",n:"Cổ vai gáy"},{k:"kegel",n:"Kegel"}];
const PLACES={"gym":"Gym","ngoai-troi":"Ngoài trời","ca-hai":"Gym + ngoài trời"};
const gname=k=>(GROUPS.find(g=>g.k===k)||{n:k}).n;
const gcolor=k=>`var(--g-${k},var(--muted))`;

const state={items:[],group:"all",place:"all",q:"",session:null,canWrite:false,db:null,assets:null,loaded:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

const saved=ls("sbt-ui");if(saved){state.group=saved.group||"all";state.place=saved.place||"all"}
state.session=ls("sbt-session");

function mediaSrc(m){return "clips/"+m.id+(m.type==="image"?".jpg":".mp4")}
function mediaHTML(m,ph,k){
  if(!m) return `<span class="ph" style="--c:${gcolor(k)}">${esc(ph)}</span>`;
  const src=esc(mediaSrc(m));
  return m.type==="video"
    ? `<video data-src="${src}" muted loop playsinline preload="none"></video>`
    : `<img src="${src}" alt="" loading="lazy">`;
}
function initials(name){return String(name||"?").split(/\s+/).slice(0,2).map(w=>w[0]).join("")}

function filtered(){
  const q=state.q.trim().toLowerCase();
  return state.items.filter(x=>{
    if(state.group!=="all"&&x.group!==state.group)return false;
    if(state.place!=="all"&&x.place!=="ca-hai"&&x.place!==state.place)return false;
    if(q&&!(`${x.name} ${x.nameEn||""} ${x.muscles||""}`.toLowerCase().includes(q)))return false;
    return true;
  });
}

function renderGroups(){
  const count=k=>state.items.filter(x=>k==="all"||x.group===k).length;
  const all=[{k:"all",n:"Tất cả"},...GROUPS];
  $("#groups").innerHTML=all.map(g=>`<button class="g" type="button" data-k="${g.k}" aria-pressed="${state.group===g.k}" style="--c:${gcolor(g.k)}">${g.k!=="all"?'<span class="dot"></span>':""}${g.n}<span class="n">${count(g.k)}</span></button>`).join("");
  document.querySelectorAll("#place button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.place));
}

function card(x){
  const m=(x.media||[])[0];
  return `<button class="card" type="button" data-id="${esc(x.id)}" aria-label="${esc(x.name)}" style="--c:${gcolor(x.group)}">
    <div class="media">${mediaHTML(m,initials(x.name),x.group)}${x.example?'<span class="badge">Mẫu</span>':""}</div>
    <div class="cbody"><div class="cname">${esc(x.name)}</div>${x.dose?`<span class="cdose">${esc(x.dose)}</span>`:""}</div></button>`;
}

function renderList(){
  const items=filtered().sort((a,b)=>((a.top??999)-(b.top??999))||a.name.localeCompare(b.name,"vi"));
  const el=$("#list");
  if(!state.loaded){el.innerHTML=`<div class="empty"><b>Đang tải bài tập…</b>Các bài tập sẽ hiện ở đây theo từng nhóm cơ.</div>`;return}
  if(!state.items.length){el.innerHTML=`<div class="empty"><b>Chưa có bài tập</b>Trang đang được cập nhật${state.canWrite?', hoặc bấm “+ Thêm bài”':""}.</div>`;return}
  if(!items.length){el.innerHTML=`<div class="empty"><b>Không có bài phù hợp</b>Thử nhóm cơ hoặc nơi tập khác.</div>`;return}
  if(state.group!=="all"){el.innerHTML=`<div class="grid" style="margin-top:16px">${items.map(card).join("")}</div>`;return}
  el.innerHTML=GROUPS.map(g=>{
    const its=items.filter(x=>x.group===g.k); if(!its.length)return "";
    return `<h2 class="section-h" style="--c:${gcolor(g.k)}"><span class="bar"></span>${g.n}</h2><div class="grid">${its.map(card).join("")}</div>`;
  }).join("");
}

function renderSession(){
  const s=state.session,el=$("#session");
  if(!s||!s.ids||!s.ids.length){el.hidden=true;return}
  const rows=s.ids.map(id=>state.items.find(x=>x.id===id)).filter(Boolean);
  if(!rows.length){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=`<h2>Buổi tập: ${esc(s.label)}<span class="actions"><button class="btn" type="button" id="reroll">Bốc lại</button><button class="btn" type="button" id="closeS">Đóng</button></span></h2>
  <ol>${rows.map(x=>{const d=(s.done||[]).includes(x.id);return `<li class="${d?"done":""}"><input type="checkbox" id="s-${esc(x.id)}" data-id="${esc(x.id)}" ${d?"checked":""} aria-label="Đã tập ${esc(x.name)}"><button type="button" data-open="${esc(x.id)}">${esc(x.name)}</button><span class="dose">${esc(x.dose||"")}</span></li>`}).join("")}</ol>`;
}

function render(){renderGroups();renderSession();renderList()}

function pickSession(){
  const pool=filtered().filter(x=>x.group!=="gian-co");
  if(!pool.length){return}
  const a=[...pool];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const label=state.group==="all"?"tổng hợp":gname(state.group);
  state.session={ids:a.slice(0,5).map(x=>x.id),done:[],label};
  ls("sbt-session",state.session);renderSession();
  $("#session").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* detail sheet */
function openDetail(id){
  const x=state.items.find(i=>i.id===id); if(!x)return;
  const media=x.media||[]; let cur=0;
  const ov=$("#overlay");
  const facts=[x.dose&&`<span class="fact"><b>${esc(x.dose)}</b></span>`,x.rest&&`<span class="fact">Nghỉ <b>${esc(x.rest)}</b></span>`,x.muscles&&`<span class="fact">${esc(x.muscles)}</span>`,x.equipment&&`<span class="fact">Dụng cụ: ${esc(x.equipment)}</span>`,x.place&&`<span class="fact">${esc(PLACES[x.place]||x.place)}</span>`].filter(Boolean).join("");
  const list=(arr,cls,h,tag="ul")=>arr&&arr.length?`<div class="blk ${cls}"><h3>${h}</h3><${tag}>${arr.map(s=>`<li>${esc(s)}</li>`).join("")}</${tag}></div>`:"";
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(x.name)}" style="--c:${gcolor(x.group)}">
    <div class="media" id="dm">${mediaHTML(media[0],initials(x.name),x.group)}</div>
    ${media.length>1?`<div class="thumbs">${media.map((m,i)=>`<button type="button" data-i="${i}" aria-pressed="${i===0}" aria-label="Hình ${i+1}">${m.type==="video"?`<video src="${esc(mediaSrc(m))}" muted preload="metadata"></video>`:`<img src="${esc(mediaSrc(m))}" alt="">`}</button>`).join("")}</div>`:""}
    <div class="shead"><div><h2>${esc(x.name)}</h2>${x.nameEn?`<div class="en">${esc(x.nameEn)} · ${esc(gname(x.group))}</div>`:`<div class="en">${esc(gname(x.group))}</div>`}</div><button class="x" type="button" id="closeD" aria-label="Đóng">×</button></div>
    <div class="sbody">
      ${facts?`<div class="facts">${facts}</div>`:""}
      ${list(x.steps,"","Cách làm","ol")}
      ${list(x.cues,"cues","Mẹo cảm nhận đúng")}
      ${list(x.mistakes,"miss","Lỗi hay gặp")}
      ${x.easier||x.harder?`<div class="blk"><h3>Biến thể</h3><ul>${x.easier?`<li>Dễ hơn: ${esc(x.easier)}</li>`:""}${x.harder?`<li>Khó hơn: ${esc(x.harder)}</li>`:""}</ul></div>`:""}
      ${x.source?`<div class="blk"><h3>Nguồn</h3>${/^https?:\/\//.test(x.source)?`<a class="srcl" href="${esc(x.source)}" target="_blank" rel="noopener">${esc(x.source)}</a>`:esc(x.source)}</div>`:""}
    </div>
    ${state.canWrite?`<div class="sfoot"><button class="btn danger" type="button" id="delD">Xóa bài</button><button class="btn" type="button" id="editD">Sửa</button></div>`:""}
  </div>`;
  ov.hidden=false;
  ov.querySelectorAll(".thumbs button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;$("#dm").innerHTML=mediaHTML(media[cur],"",x.group);ov.querySelectorAll(".thumbs button").forEach(t=>t.setAttribute("aria-pressed",t===b))});
  $("#closeD").onclick=closeOverlay; $("#closeD").focus();
  const del=$("#delD");
  if(del){del.onclick=async()=>{
    if(!del.classList.contains("armed")){del.classList.add("armed");del.textContent="Bấm lần nữa để xóa";setTimeout(()=>{del.classList.remove("armed");del.textContent="Xóa bài"},4000);return}
    try{await state.db.collection("exercises").doc(x.id).delete();closeOverlay()}catch(e){del.textContent="Không xóa được, thử lại"}
  }; $("#editD").onclick=()=>openEditor(x)}
}
function closeOverlay(){const ov=$("#overlay");ov.hidden=true;ov.innerHTML=""}

/* editor */
function slug(s){return String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"bai"}
function openEditor(x){
  x=x||{group:state.group!=="all"?state.group:"nguc",place:state.place!=="all"?state.place:"ca-hai",media:[]};
  let media=[...(x.media||[])];
  const ov=$("#overlay");
  ov.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Thêm bài tập"><form class="ed" id="ed">
    <div class="shead" style="padding:0"><h2>${x.id?"Sửa bài":"Thêm bài"}</h2><button class="x" type="button" id="closeE" aria-label="Đóng">×</button></div>
    <div class="row"><label>Tên bài<input id="f-name" required value="${esc(x.name)}" placeholder="Hít đất"></label>
      <label>Tên tiếng Anh<input id="f-en" value="${esc(x.nameEn)}" placeholder="Push-up"></label></div>
    <div class="row"><label>Nhóm cơ<select id="f-group">${GROUPS.map(g=>`<option value="${g.k}" ${x.group===g.k?"selected":""}>${g.n}</option>`).join("")}</select></label>
      <label>Nơi tập<select id="f-place">${Object.entries(PLACES).map(([k,v])=>`<option value="${k}" ${x.place===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
    <div class="row"><label>Liều tập<input id="f-dose" value="${esc(x.dose)}" placeholder="3 × 12"></label>
      <label>Nghỉ giữa hiệp<input id="f-rest" value="${esc(x.rest)}" placeholder="60s"></label></div>
    <div class="row"><label>Cơ chính<input id="f-mus" value="${esc(x.muscles)}" placeholder="Ngực, tay sau"></label>
      <label>Dụng cụ<input id="f-eq" value="${esc(x.equipment)}" placeholder="Không cần"></label></div>
    <label>Cách làm <span class="hint">mỗi dòng một bước, tối đa 3–4 bước</span><textarea id="f-steps">${esc((x.steps||[]).join("\n"))}</textarea></label>
    <label>Mẹo cảm nhận đúng <span class="hint">mỗi dòng một ý</span><textarea id="f-cues">${esc((x.cues||[]).join("\n"))}</textarea></label>
    <label>Lỗi hay gặp <span class="hint">mỗi dòng một ý</span><textarea id="f-miss">${esc((x.mistakes||[]).join("\n"))}</textarea></label>
    <div class="row"><label>Biến thể dễ hơn<input id="f-easy" value="${esc(x.easier)}"></label><label>Biến thể khó hơn<input id="f-hard" value="${esc(x.harder)}"></label></div>
    <label>Nguồn (link video gốc)<input id="f-src" value="${esc(x.source)}" placeholder="https://…"></label>
    <label id="mwrap">Ảnh / GIF / video minh họa<input id="f-media" type="file" accept="image/*,video/*" multiple></label>
    <div class="mlist" id="mlist"></div>
    <div class="status" id="st"></div>
    <div class="actions" style="justify-content:flex-end"><button class="btn" type="button" id="cancelE">Hủy</button><button class="btn primary" type="submit" id="saveE">Lưu bài</button></div>
  </form></div>`;
  ov.hidden=false;
  if(!state.assets)$("#mwrap").hidden=true;
  const drawM=()=>{$("#mlist").innerHTML=media.map((m,i)=>`<div class="mitem">${m.type==="video"?`<video src="${esc(mediaSrc(m))}" muted></video>`:`<img src="${esc(mediaSrc(m))}" alt="">`}<button type="button" data-i="${i}" aria-label="Bỏ hình">×</button></div>`).join("");
    $("#mlist").querySelectorAll("button").forEach(b=>b.onclick=()=>{media.splice(+b.dataset.i,1);drawM()})};
  drawM();
  const st=$("#st");
  $("#f-media").onchange=async e=>{
    const files=[...e.target.files];
    for(const f of files){
      st.className="status";st.textContent=`Đang tải ${f.name}…`;
      try{const r=await state.assets.upload(f);media.push({id:r.id,url:r.url,type:f.type.startsWith("video")?"video":"image"});drawM();st.textContent=""}
      catch(err){st.className="status err";st.textContent=`Không tải được ${f.name}: ${err&&err.message||"lỗi"}. File tối đa 20 MB.`}
    }
    e.target.value="";
  };
  $("#closeE").onclick=$("#cancelE").onclick=closeOverlay;
  $("#ed").onsubmit=async ev=>{
    ev.preventDefault();
    const name=$("#f-name").value.trim(); if(!name)return;
    const id=x.id||(slug(name)+"-"+Date.now().toString(36));
    const doc={name,nameEn:$("#f-en").value.trim(),group:$("#f-group").value,place:$("#f-place").value,
      dose:$("#f-dose").value.trim(),rest:$("#f-rest").value.trim(),muscles:$("#f-mus").value.trim(),equipment:$("#f-eq").value.trim(),
      steps:lines($("#f-steps").value),cues:lines($("#f-cues").value),mistakes:lines($("#f-miss").value),
      easier:$("#f-easy").value.trim(),harder:$("#f-hard").value.trim(),source:$("#f-src").value.trim(),
      media:media.map(m=>({id:m.id,type:m.type})),created:x.created||new Date().toISOString().slice(0,10)};
    $("#saveE").disabled=true;st.className="status";st.textContent="Đang lưu…";
    try{await state.db.collection("exercises").doc(id).set(doc);closeOverlay();openDetail(id)}
    catch(e){$("#saveE").disabled=false;st.className="status err";st.textContent=e&&e.code==="invalid_argument"?"Bạn không có quyền ghi vào trang này.":"Chưa lưu được. Thử lại sau vài giây."}
  };
  $("#f-name").focus();
}

/* events */
$("#groups").onclick=e=>{const b=e.target.closest(".g");if(!b)return;state.group=b.dataset.k;ls("sbt-ui",{group:state.group,place:state.place});render()};
$("#place").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.place=b.dataset.v;ls("sbt-ui",{group:state.group,place:state.place});render()};
$("#q").oninput=e=>{state.q=e.target.value;renderList()};
$("#list").onclick=e=>{const c=e.target.closest(".card");if(c)openDetail(c.dataset.id)};
$("#pickBtn").onclick=pickSession;
$("#session").onclick=e=>{
  if(e.target.id==="reroll")return pickSession();
  if(e.target.id==="closeS"){state.session=null;ls("sbt-session",null);return renderSession()}
  const o=e.target.closest("[data-open]");if(o)return openDetail(o.dataset.open);
};
$("#session").onchange=e=>{const id=e.target.dataset.id;if(!id)return;const d=new Set(state.session.done||[]);e.target.checked?d.add(id):d.delete(id);state.session.done=[...d];ls("sbt-session",state.session);renderSession()};
$("#overlay").onclick=e=>{if(e.target.id==="overlay")closeOverlay()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#overlay").hidden)closeOverlay()});

render();


const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>{for(const e of es){const v=e.target;if(e.isIntersecting){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}else{v.pause()}}},{rootMargin:"200px"}):null;
function wireVideos(root){root.querySelectorAll("video[data-src]").forEach(v=>{if(v.closest("#overlay")){if(!v.src){v.src=v.dataset.src;v.play().catch(()=>{})}}else if(io)io.observe(v);else if(!v.src){v.src=v.dataset.src;v.autoplay=true}})}
const _mo=new MutationObserver(()=>{wireVideos(document)});_mo.observe(document.body,{childList:true,subtree:true});
fetch("data.json").then(r=>r.json()).then(d=>{state.items=d;state.loaded=true;render()}).catch(()=>{state.loaded=true;renderList()});
</script>

</body>
</html>
